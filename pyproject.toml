[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperclip-cli"
version = "0.1.0"
description = "Python CLI for Paperclip AI agent orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "responses>=0.23",
]

[project.scripts]
paperclip-cli = "paperclip_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["paperclip_cli*"]
